# Deploying this Blueprint creates PAID resources. Review Render's displayed prices first.
services:
  - type: web
    name: personal-finance-bot
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: DATABASE_URL
        fromDatabase:
          name: finance-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
      - key: INGEST_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SUMMARY_HOUR
        value: "8"
databases:
  - name: finance-db
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: frankfurt
    databaseName: finance
    user: finance
    ipAllowList: []
